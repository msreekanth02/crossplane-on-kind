apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: example-service
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Service
      metadata:
        name: nginx-service
        namespace: crossplane-example
      spec:
        selector:
          app: nginx
        ports:
        - protocol: TCP
          port: 80
          targetPort: 80
        type: ClusterIP
  providerConfigRef:
    name: kubernetes-provider
